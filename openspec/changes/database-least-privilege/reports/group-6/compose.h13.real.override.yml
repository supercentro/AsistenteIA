# Scratch override used ONLY by run_h13_real.sh, on top of the REAL docker-compose.yml (read, never modified).
# Project g28h13: its own network and named volume, no published port, no real env file, no source mount.
# bootstrap, migrate and backend run the image built from this branch (it contains db-bootstrap and db-migrate);
# the worker runs the existing worker image of main (the worker code did not change).
services:
  db:
    ports: !reset []
    env_file: !override
      - ${H13_DIR}/db.env
    cpus: 1
    mem_limit: 1g

  bootstrap:
    image: asistenteia-backend:g6-branch
    build: !reset null
    pull_policy: never
    env_file: !override
      - ${H13_DIR}/roles.env
    cpus: 1
    mem_limit: 512m

  migrate:
    image: asistenteia-backend:g6-branch
    build: !reset null
    pull_policy: never
    env_file: !override
      - ${H13_DIR}/migrate.env
    cpus: 1
    mem_limit: 512m

  backend:
    image: asistenteia-backend:g6-branch
    build: !reset null
    pull_policy: never
    ports: !reset []
    env_file: !override
      - ${H13_DIR}/api.env
    volumes: !override []
    command: !override ["uvicorn", "app.main:app_factory", "--factory", "--no-proxy-headers", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3).status == 200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 12
    cpus: 1
    mem_limit: 512m

  worker:
    image: asistenteia-worker:main-f455234
    build: !reset null
    pull_policy: never
    env_file: !override
      - ${H13_DIR}/worker.env
    volumes: !override []

  frontend:
    profiles: ["h13-excluded"]
