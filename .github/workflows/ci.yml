name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg15
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci_password_not_a_secret
          POSTGRES_DB: asistenteia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d asistenteia"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://ci:ci_password_not_a_secret@127.0.0.1:5432/asistenteia
      TEST_DATABASE_URL: postgresql+psycopg://ci:ci_password_not_a_secret@127.0.0.1:5432/asistenteia_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.9"
      - name: Generate an ephemeral JWT secret
        run: |
          SECRET="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')"
          echo "::add-mask::$SECRET"
          echo "JWT_SECRET=$SECRET" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: uv sync --frozen --extra ingestion
      - name: Create test database
        run: PGPASSWORD=ci_password_not_a_secret psql -h 127.0.0.1 -U ci -d asistenteia -c "CREATE DATABASE asistenteia_test"
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy --strict app tests
      - name: Unit tests
        run: uv run pytest tests/unit
      - name: Integration tests
        run: uv run pytest tests/integration --cov=app --cov-report=term-missing
      - name: Dependency audit (non-blocking)
        run: uv run pip-audit
        continue-on-error: true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Type check
        run: npm run typecheck
      - name: API types match docs/api-spec.yml
        run: npm run check:api-types
      - name: Unit and component tests with coverage thresholds
        run: npm run test:coverage
      - name: Build
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Browser tests against mocked API responses (no backend)
        run: npm run test:e2e
      - name: Dependency audit (non-blocking)
        run: npm audit
        continue-on-error: true
