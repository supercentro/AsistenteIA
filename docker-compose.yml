services:
  db:
    image: pgvector/pgvector:0.8.7-pg15
    # Only the POSTGRES_* variables: the container never sees the API or worker settings.
    env_file:
      - ./backend/.env.db
    ports:
      - "127.0.0.1:5442:5432" # host port 5442 avoids clashes with other local PostgreSQL instances
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot database administration (change database-least-privilege). Both run on EVERY `up`
  # (a plain `up` starts finished containers again), so both are idempotent; both use the code of the
  # image, not the working tree, so `up -d --build` is needed after `app/` or `alembic/` change.
  # They are in the default profile on purpose: a service in an inactive profile that others
  # depend on makes the whole project invalid. If either fails, `backend` and `worker` are created
  # but never started. Each holds only the credentials of its own job.
  bootstrap:
    build:
      context: ./backend
      target: api
    # The administrator URL and the four role passwords: no other service receives this file.
    # `required: false` keeps `docker compose ps/logs/exec/down` working on a machine that does not
    # have the file yet; running the service without it fails at once, naming the missing variable.
    env_file:
      - path: ./backend/.env.roles
        required: false
    command: ["python", "-m", "app.cli", "db-bootstrap", "--database", "asistenteia"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  migrate:
    build:
      context: ./backend
      target: api
    # Only the migrator URL (MIGRATION_DATABASE_URL): no JWT secret, no API or administrator setting.
    # Optional for the same reason as above.
    env_file:
      - path: ./backend/.env.migrate
        required: false
    command: ["python", "-m", "app.cli", "db-migrate"]
    restart: "no"
    depends_on:
      bootstrap:
        condition: service_completed_successfully

  # Administrative commands (create-teacher, seed) under the CLI database role. Run on demand, never
  # by a plain `up`: docker compose run --rm cli create-teacher --email ... --password-stdin
  # It holds only the CLI credential (CLI_DATABASE_URL); the API and the worker never receive it.
  cli:
    profiles: ["cli"]
    build:
      context: ./backend
      target: api
    env_file:
      - path: ./backend/.env.cli
        required: false
    entrypoint: ["python", "-m", "app.cli"]
    restart: "no"
    depends_on:
      migrate:
        condition: service_completed_successfully

  backend:
    build:
      context: ./backend
      target: api
    env_file:
      - ./backend/.env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./backend/app:/app/app
    command:
      [
        "uvicorn",
        "app.main:app_factory",
        "--factory",
        "--no-proxy-headers",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
        "--reload-dir",
        "/app/app",
      ]

  # Ingestion worker (change 6): `python -m app.worker`, a process separate from the API. A plain
  # `docker compose up` starts it. CPU and memory are the values validated by the spike;
  # EMBEDDING_THREADS is left unset so inference follows the CPU quota below.
  worker:
    build:
      context: ./backend
      target: worker
    # Its own file: the worker holds no JWT secret and no API setting (copy .env.worker.example).
    env_file:
      - ./backend/.env.worker
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    cpus: 4
    mem_limit: 2g
    # Restart after any exit: a crash, an out-of-memory kill, or the worker ending itself when it
    # stalls (app/worker_health.py). A healthcheck alone would not restart anything.
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker_health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s # the model loads before the first beat
    volumes:
      # Read-only: the worker parses untrusted files and has no reason to write its code.
      - ./backend/app:/app/app:ro

  frontend:
    build: ./frontend
    env_file:
      - ./frontend/.env
    environment:
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  db_data:
