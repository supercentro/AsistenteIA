services:
  db:
    image: pgvector/pgvector:0.8.7-pg15
    env_file:
      - ./backend/.env
    ports:
      - "127.0.0.1:5442:5432" # host port 5442 avoids clashes with other local PostgreSQL instances
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      target: api
    env_file:
      - ./backend/.env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
    command:
      [
        "uvicorn",
        "app.main:app_factory",
        "--factory",
        "--no-proxy-headers",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
        "--reload-dir",
        "/app/app",
      ]

  # Ingestion worker (change 6). The `worker` profile keeps it out of a plain `docker compose up`
  # until `python -m app.worker` exists (group 8 of the change removes the profile). Start it with
  # `docker compose --profile worker up -d worker`. CPU and memory are the values validated by the
  # spike; EMBEDDING_THREADS is left unset so inference follows the CPU quota below.
  worker:
    profiles: ["worker"]
    build:
      context: ./backend
      target: worker
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    cpus: 4
    mem_limit: 2g
    volumes:
      - ./backend/app:/app/app

  frontend:
    build: ./frontend
    env_file:
      - ./frontend/.env
    environment:
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  db_data:
