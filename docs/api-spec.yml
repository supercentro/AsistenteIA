openapi: 3.0.3
info:
  title: AsistenteIA API
  version: 0.1.0
  description: |
    Canonical REST contract of AsistenteIA (RAG academic assistant by subject).
    The `readme.md` documents only the three core endpoints as an academic summary; this file is authoritative.

    Conventions:
    - All endpoints except `/health`, `/auth/register` and `/auth/login` require a Bearer JWT.
    - Errors use the common `Error` schema. Authorization failures never reveal whether a resource exists
      for another user: accessing someone else's resource returns 404 unless the caller is known to be
      authenticated and the resource type is not user-scoped (see each endpoint).
    - Chat requires consent for the current privacy-policy version (`POST /users/me/consent`), otherwise 403 `CONSENT_REQUIRED`.
servers:
  - url: http://localhost:8000/api/v1
    description: Local development (docker compose)
tags:
  - name: Auth
  - name: Subjects
  - name: Enrollments
  - name: Documents
  - name: Chat
  - name: Conversations
  - name: Health

paths:
  /health:
    get:
      tags: [Health]
      summary: Liveness and database connectivity check
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
        '503':
          description: Database is unreachable (code `SERVICE_UNAVAILABLE`; no connection details are exposed)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new student account
      description: Public registration always creates role `student`. Teacher accounts are created out of band (seed/CLI command, see development guide) to prevent privilege escalation.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429':
          description: Too many registrations from this client address (code `RATE_LIMITED`). Configurable (`REGISTER_RATE_LIMIT`, default 5/minute); counters are in memory per process.
          headers:
            Retry-After:
              description: Seconds until another attempt is allowed
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /auth/login:
    post:
      tags: [Auth]
      summary: Obtain an access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, maxLength: 255, description: ASCII only; compared in lowercase }
                password: { type: string, format: password, minLength: 1, maxLength: 128 }
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401':
          description: Unknown email or wrong password (identical response for both; code `INVALID_CREDENTIALS`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429':
          description: Too many login attempts from this client address (code `RATE_LIMITED`). Limit is configurable (`LOGIN_RATE_LIMIT`, default 10/minute); counters are in memory per process.
          headers:
            Retry-After:
              description: Seconds until another attempt is allowed
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: Database unreachable (code `SERVICE_UNAVAILABLE`; no connection details)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /users/me:
    get:
      tags: [Auth]
      summary: Current user profile
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [Auth]
      summary: Delete the account and all associated personal data (right to erasure)
      responses:
        '204': { description: Account and data deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: A teacher must delete or reassign their subjects first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /users/me/consent:
    post:
      tags: [Auth]
      summary: Record acceptance of the privacy policy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [consent_version]
              properties:
                consent_version: { type: string, minLength: 1, maxLength: 20, example: "2026-10-v1" }
      responses:
        '200':
          description: Consent recorded (version and date updated, also on re-acceptance)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422':
          description: |
            Validation failed. A version that is not the currently configured policy version returns code
            `INVALID_CONSENT_VERSION` with `details.current_version`; an empty or over-long value returns `VALIDATION_ERROR`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /users/me/conversations:
    delete:
      tags: [Conversations]
      summary: Delete all of the current student's conversations (right to erasure)
      description: Role student. Permanent and irreversible.
      responses:
        '204': { description: All conversations deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /subjects:
    get:
      tags: [Subjects]
      summary: List subjects visible to the caller (teacher - taught subjects; student - enrolled subjects)
      responses:
        '200':
          description: Subjects
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Subject' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Subjects]
      summary: Create a subject (role teacher)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubjectCreate' }
      responses:
        '201':
          description: Subject created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subject' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /subjects/{subject_id}:
    parameters:
      - $ref: '#/components/parameters/SubjectId'
    get:
      tags: [Subjects]
      summary: Get a subject (owner teacher or enrolled student; any other caller gets 404)
      responses:
        '200':
          description: Subject
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subject' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Subjects]
      summary: Delete a subject with its documents, chunks, enrollments and conversations (role teacher, owner; another teacher gets 404)
      responses:
        '204': { description: Subject deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /subjects/{subject_id}/enrollments:
    parameters:
      - $ref: '#/components/parameters/SubjectId'
    get:
      tags: [Enrollments]
      summary: List enrolled students, ordered by creation time (role teacher, owner)
      responses:
        '200':
          description: Enrollments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Enrollment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Enrollments]
      summary: Enroll a registered student by email (role teacher, owner)
      description: |
        An email that belongs to no account, or to a teacher, answers the same 404 (no pre-enrollment).
        Enrolling a student twice answers 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [student_email]
              properties:
                student_email: { type: string, format: email, maxLength: 255, description: ASCII only (non-ASCII is rejected with 422); stored and matched in lowercase }
      responses:
        '201':
          description: Student enrolled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Enrollment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /subjects/{subject_id}/enrollments/{student_id}:
    delete:
      tags: [Enrollments]
      summary: Remove a student from a subject (role teacher, owner)
      parameters:
        - $ref: '#/components/parameters/SubjectId'
        - name: student_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Enrollment removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /subjects/{subject_id}/activity:
    parameters:
      - $ref: '#/components/parameters/SubjectId'
    get:
      tags: [Activity]
      summary: Aggregate activity of a subject for its owning teacher (disabled by default)
      description: |
        Aggregate figures only: numbers, dates and the file names of the documents of the subject. Never
        the text of a question or an answer, and never an identifier, name, e-mail or figure of a student.
        Only the teacher who owns the subject reads it; another teacher's subject and an unknown subject
        answer the same 404, and a student or an anonymous caller is refused (403, 401) before the
        capability is looked at.

        The capability is switched off by the setting `TEACHER_ACTIVITY_ENABLED` (default `false`): while it
        is off a teacher gets 404. It stays off until the privacy text, the legal review and the consent
        version are in place. **The read does not look at what a student accepted**: it counts
        earlier activity written under earlier policies (TD-072), which the legal evaluation of the
        real data has to settle before it is switched on.

        Rules: a figure that comes from fewer than `minimum_group` (5) distinct students is `null`,
        including a figure with no student at all; a subject with fewer than `minimum_group` active
        students shows only `enrolled_students`. The window is aligned to whole weeks (Monday to Sunday,
        UTC) and covers at most 12 weeks (84 days); `start` and `end` are widened to those weeks and the
        response states the window actually computed. **Only weeks that have ended are shown**: the open
        week is never part of the window, an `end` inside it (or in the future) is cut at the last Sunday
        that has passed (a week counts as ended one hour after its Sunday); apart from the enrolled count, enrolments, unenrolments, deletions of conversations and changes to the documents of the subject, a read gives the same answer at any moment of one week. **The weeks that start
        before the last unenrolment of the subject are not shown** (the subject keeps the moment of its
        last unenrolment, which no response carries), so the window can be shorter than requested and can
        hold no week at all: then `weeks` is 0, `start` is the day after `end`, `questions` is empty and
        every window-wide figure is `null`, while `enrolled_students` is still given. Only students
        currently enrolled count, and only the data that exists when the request is made (deleting a
        conversation, or unenrolling a student, lowers the next result); no figure is stored. `no_material_rate` is the share of answers that stored
        no source; `no_cited_source_rate` the share of answers that do not cite any of their sources (it
        includes the answers with no material) and is never a measure of quality. `cited_appearances` is
        the number of answers that cite the document: it is not semantic support and not proof that the
        material was used. Both rates are `null` below the minimum group. `active_students`, the two
        rates and `cited_appearances` cover the whole window that is returned; `enrolled_students` is
        the number enrolled when the request is made. `documents` lists current documents only:
        a deleted one is never listed, even if answers cited it.

        **These figures are not anonymous, and no such guarantee is given (TD-069, open).** The minimum
        group counts who contributed, so: two windows can be subtracted; the rates can give the size of a
        withheld week; the totals and rates can be subtracted from the document figures, which gives or
        bounds groups of few students; `active_students` against the weekly cells bounds who asked in
        some weeks only; when the counted group is the whole class, one response says something about each
        enrolled student; a rate of 0 or 1 says the same about every counted student;
        `enrolled_students` minus `active_students` can show that exactly one enrolled student asked
        nothing, though not which one; one
        student can be most of a figure or of one side of a rate; two reads can be
        compared after an erasure or a deletion; and a teacher can pad a group with accounts (TD-071).
      parameters:
        - name: start
          in: query
          required: false
          schema: { type: string, format: date }
          description: First day of the window (default, 12 weeks ending with the week of `end`, which is cut at the last week that has ended)
        - name: end
          in: query
          required: false
          schema: { type: string, format: date }
          description: Last day of the window (default and maximum, the last Sunday that has passed, in UTC)
        - name: granularity
          in: query
          required: false
          schema: { type: string, enum: [week], default: week }
      responses:
        '200':
          description: Aggregate activity
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActivityResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /subjects/{subject_id}/documents:
    parameters:
      - $ref: '#/components/parameters/SubjectId'
    get:
      tags: [Documents]
      summary: List documents of a subject with processing status (owner teacher)
      responses:
        '200':
          description: Documents
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Document' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Documents]
      summary: Upload course material (owner teacher)
      description: |
        Accepts PDF, plain text (`.txt`) or Markdown (`.md`) up to `MAX_UPLOAD_MB` (10 MB by default, measured on
        the bytes actually received). The type is decided from the extension and the content, never from the
        client `Content-Type`; the file name is cleaned (last path component, no control or bidirectional
        characters, at most 255 characters).

        The `202` is a promise: the document (`status: pending`), its processing job and the uploaded bytes are
        committed together before the response is sent. A separate worker then extracts, chunks and embeds the
        text; the client polls `GET /subjects/{subject_id}/documents` until the document is `ready` or `failed`.
        A failed document carries a stable `error_code` and a fixed `error_message`. The original file is never
        kept after processing.

        Authentication, role and ownership are decided before the body is read. Errors: `413` as soon as more than
        the limit has been received (also without `Content-Length`); `415` for a type that is not allowed or does
        not match its content (including invalid UTF-8 or NUL bytes in text); `422` with
        `details.reason` = `MALFORMED_MULTIPART`, `FILE_PART_MISSING`, `UNEXPECTED_FIELDS`, `EMPTY_FILE` or
        `INVALID_FILENAME`; `408` when a client that stays connected does not send the body in time (nothing can
        be promised to a client that has already closed the connection; in that case nothing is stored);
        `409` when the subject already holds `MAX_DOCUMENTS_PER_SUBJECT` documents; `429` above the upload rate
        limit; `503` when the ingestion queue is full, too many uploads are being received, or the upload cannot be
        stored (all with a fixed message).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              additionalProperties: false
              properties:
                file:
                  type: string
                  format: binary
                  description: Exactly one non-empty file part named `file`; no other fields are accepted
      responses:
        '202':
          description: Upload accepted; the document is durable and `pending`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '408':
          description: A client that stayed connected did not send the body in time (error code `REQUEST_TIMEOUT`); nothing was stored
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '409':
          description: The subject already holds the maximum number of documents (error code `DOCUMENT_QUOTA_EXCEEDED`)
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '413':
          description: File too large (error code `PAYLOAD_TOO_LARGE`)
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '415':
          description: Unsupported file type or content that does not match the type (error code `UNSUPPORTED_MEDIA_TYPE`)
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '422':
          description: |
            Invalid multipart request (error code `VALIDATION_ERROR`). `details.reason` is one of
            `MALFORMED_MULTIPART`, `FILE_PART_MISSING`, `UNEXPECTED_FIELDS`, `EMPTY_FILE`, `INVALID_FILENAME`.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '429':
          description: Upload rate limit exceeded (error code `RATE_LIMITED`)
          headers:
            Retry-After: { description: Seconds to wait before retrying, schema: { type: integer } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '503':
          description: The ingestion queue is full or too many uploads are in progress (error code `INGESTION_QUEUE_FULL`), or the upload could not be stored (error code `SERVICE_UNAVAILABLE`)
          headers:
            Retry-After: { description: Seconds to wait before retrying, schema: { type: integer } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /subjects/{subject_id}/documents/{document_id}:
    delete:
      tags: [Documents]
      summary: Delete a document and its chunks (owner teacher)
      parameters:
        - $ref: '#/components/parameters/SubjectId'
        - name: document_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      description: Also valid while the document is being processed; the job and any temporary bytes are removed with it
      responses:
        '204': { description: Document deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /chat:
    post:
      tags: [Chat]
      summary: Ask the assistant a question about a subject (role student, enrolled, consent recorded)
      description: |
        Retrieval is restricted to chunks of `subject_id`. If `conversation_id` is given it must belong to the
        caller AND to the same `subject_id`. When no chunk reaches the relevance threshold the response has
        `no_material=true`, empty `sources`, and the LLM is not called.
        A subject that does not exist is 404 and a subject the student is not enrolled in is 403, so a
        student can learn whether a subject identifier exists (accepted, TD-061).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject_id, message]
              properties:
                subject_id: { type: string, format: uuid }
                conversation_id: { type: string, format: uuid, nullable: true }
                message: { type: string, minLength: 1, maxLength: 2000 }
            example:
              subject_id: b2c3d4e5-1111-2222-3333-abcdef123456
              message: "What is the difference between RAG and fine-tuning?"
      responses:
        '200':
          description: Assistant answer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429':
          description: Chat rate limit exceeded (error code `RATE_LIMITED`)
          headers:
            Retry-After: { description: Seconds to wait before retrying, schema: { type: integer } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '500': { $ref: '#/components/responses/InternalError' }
        '502': { description: LLM provider failed or blocked the answer (retryable), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /conversations:
    get:
      tags: [Conversations]
      summary: List the caller's conversations, optionally filtered by subject (role student)
      parameters:
        - name: subject_id
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Conversations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Conversation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /conversations/{conversation_id}/messages:
    get:
      tags: [Conversations]
      summary: Messages of one of the caller's conversations, with sources
      parameters:
        - $ref: '#/components/parameters/ConversationId'
      responses:
        '200':
          description: Messages ordered by creation time
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Message' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /conversations/{conversation_id}:
    delete:
      tags: [Conversations]
      summary: Permanently delete one of the caller's conversations and its messages
      parameters:
        - $ref: '#/components/parameters/ConversationId'
      responses:
        '204': { description: Conversation deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    SubjectId:
      name: subject_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ConversationId:
      name: conversation_id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Unauthorized:
      description: Missing or invalid token
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: Authenticated but not allowed (wrong role; for chat also not enrolled or consent missing)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Resource does not exist or is not visible to the caller (including another user's resources); the body is identical in both cases
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Conflict:
      description: Resource already exists or state conflict
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    ValidationError:
      description: Request validation failed
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    InternalError:
      description: |
        Unexpected server error (code `INTERNAL_ERROR`, no details). When the cause is a write that the
        database refused at commit, the transaction was rolled back and nothing was stored or removed.
        An error raised after a successful commit is reported the same way, so a client that must be
        sure reads the resource before it repeats a request that is not idempotent.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    ServiceUnavailable:
      description: |
        The database could not be reached or the connection was lost (code `SERVICE_UNAVAILABLE`, no details,
        no connection data). When the connection was lost while the write was being committed, the outcome is
        uncertain: the change may or may not be stored, so read the resource before repeating the request
        (a creation that was in fact stored answers 409 when it is repeated).
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            Stable machine-readable code. Generic codes: UNAUTHORIZED, FORBIDDEN, NOT_FOUND, METHOD_NOT_ALLOWED,
            CONFLICT, VALIDATION_ERROR, INTERNAL_ERROR, SERVICE_UNAVAILABLE. Authentication adds INVALID_CREDENTIALS,
            RATE_LIMITED and INVALID_CONSENT_VERSION. Feature changes add their own (e.g. CONSENT_REQUIRED, LLM_UNAVAILABLE).
            Document upload adds PAYLOAD_TOO_LARGE (413), UNSUPPORTED_MEDIA_TYPE (415), REQUEST_TIMEOUT (408),
            DOCUMENT_QUOTA_EXCEEDED (409) and INGESTION_QUEUE_FULL (503); its 422 keeps VALIDATION_ERROR and puts a
            fixed reason in `details.reason`. The failure codes of a document (`Document.error_code`) are a separate,
            closed list.
          example: CONSENT_REQUIRED
        message: { type: string }
        details: { type: object, additionalProperties: true, nullable: true }
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        email: { type: string, format: email, maxLength: 255, description: ASCII only (non-ASCII is rejected with 422; use punycode for internationalised domains); stored in lowercase }
        password: { type: string, format: password, minLength: 10, maxLength: 128 }
    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token: { type: string }
        token_type: { type: string, example: bearer }
        expires_in: { type: integer, description: Seconds }
    User:
      type: object
      required: [id, name, email, role, consent_version, consent_accepted_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [teacher, student] }
        consent_version: { type: string, nullable: true }
        consent_accepted_at: { type: string, format: date-time, nullable: true }
    SubjectCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 150, description: Trimmed single-line text without control or direction characters; unique per teacher (case-sensitive) }
        description: { type: string, nullable: true, maxLength: 2000, description: Plain text, trimmed; a blank value is stored as null; line breaks and tabs allowed, other control characters rejected }
    Subject:
      allOf:
        - $ref: '#/components/schemas/SubjectCreate'
        - type: object
          required: [id, description, teacher_id, created_at]
          properties:
            id: { type: string, format: uuid }
            teacher_id: { type: string, format: uuid }
            created_at: { type: string, format: date-time }
    Enrollment:
      type: object
      required: [id, subject_id, student_id, student_email, created_at]
      properties:
        id: { type: string, format: uuid }
        subject_id: { type: string, format: uuid }
        student_id: { type: string, format: uuid }
        student_email: { type: string, format: email }
        created_at: { type: string, format: date-time }
    Document:
      type: object
      required: [id, subject_id, filename, content_type, size_bytes, status, chunks_count, created_at]
      properties:
        id: { type: string, format: uuid }
        subject_id: { type: string, format: uuid }
        filename: { type: string, description: Cleaned file name (never used as a path) }
        content_type: { type: string, description: 'Decided from the content: application/pdf, text/plain or text/markdown' }
        size_bytes: { type: integer, description: Number of bytes received }
        status:
          type: string
          enum: [pending, processing, ready, failed]
          description: '`pending` and `processing` until a worker finishes; `ready` (searchable, with chunks) or `failed` (final)'
        error_code:
          type: string
          nullable: true
          enum:
            - NO_EXTRACTABLE_TEXT
            - ENCRYPTED_PDF
            - CORRUPT_FILE
            - TOO_MANY_PAGES
            - TEXT_TOO_LARGE
            - TOO_MANY_CHUNKS
            - PROCESSING_TIMEOUT
            - RESOURCE_LIMIT_EXCEEDED
            - EMBEDDING_FAILED
            - PROCESSING_INTERRUPTED
            - JOB_EXPIRED
            - PROCESSING_FAILED
            - null
          description: Stable reason of a `failed` document; null otherwise. Clients translate by code and must not depend on `error_message`. The list is closed; adding a code is a contract change.
        error_message: { type: string, nullable: true, description: Fixed English sentence per `error_code`; never contains parser, database or file text }
        chunks_count: { type: integer }
        created_at: { type: string, format: date-time }
    Source:
      type: object
      description: |
        Citation of a chunk used for an answer: the chunks whose `[n]` marker the answer contains (a list such as `[1, 2]` or adjacent markers `[1][2]` cite each rank; a range such as `[1-3]` cites none), with
        `rank` the retrieval rank of the chunk (ranks can have gaps). An answer with no valid marker lists
        every retrieved chunk of its context.
      properties:
        chunk_id: { type: string, format: uuid, nullable: true }
        document_id: { type: string, format: uuid, nullable: true }
        filename: { type: string }
        page_number: { type: integer, nullable: true }
        rank: { type: integer }
        snippet: { type: string, description: Short excerpt of the chunk, maxLength 300 }
    ChatResponse:
      type: object
      required: [conversation_id, message_id, answer, sources, no_material]
      properties:
        conversation_id: { type: string, format: uuid }
        message_id: { type: string, format: uuid }
        answer: { type: string }
        no_material: { type: boolean }
        sources:
          type: array
          items: { $ref: '#/components/schemas/Source' }
        attribution:
          type: string
          nullable: true
          enum: [cited, retrieved, null]
          description: |
            Whether the sources were cited by the answer (`cited`: they are the chunks whose valid marker the answer contains) or are only the retrieved chunks because the answer holds no valid marker (`retrieved`). Null when there are no sources. It says nothing about whether a source supports a statement. Optional: clients that do not know it still receive the same `sources`.
      example:
        conversation_id: 9a8b7c6d-4444-5555-6666-abcdef123456
        message_id: 1f2e3d4c-7777-8888-9999-abcdef123456
        answer: "According to unit 1, RAG retrieves context at query time without changing model weights..."
        no_material: false
        sources:
          - { chunk_id: 3f1a9c2e-1234-4a5b-8c9d-abcdef123456, document_id: 7c6b5a49-0000-1111-2222-abcdef123456, filename: unit1-introduction.pdf, page_number: 4, rank: 1, snippet: "RAG combines retrieval with generation..." }
    ActivityWindow:
      type: object
      required: [start, end, granularity, weeks]
      properties:
        start: { type: string, format: date, description: "Monday of the first week shown; the day after end when no week is shown" }
        end: { type: string, format: date, description: "Sunday of the last week shown (never inside the open week)" }
        granularity: { type: string, enum: [week] }
        weeks: { type: integer, minimum: 0, maximum: 12, description: "Weeks shown; 0 when every week starts before the last unenrolment or has not ended" }
    ActivityPeriod:
      type: object
      required: [period_start, count]
      properties:
        period_start: { type: string, format: date, description: Monday of the week }
        count: { type: integer, nullable: true, description: Questions of the week; null when fewer than the minimum group of students asked }
    ActivityDocument:
      type: object
      required: [document_id, filename, cited_appearances]
      properties:
        document_id: { type: string, format: uuid, nullable: true, description: "Never null in this version, as deleted documents are not listed" }
        filename: { type: string }
        cited_appearances: { type: integer, nullable: true, description: "Answers that cite the document (not semantic support, not proof that the material was used); null below the minimum group of students" }
    ActivityResponse:
      type: object
      required: [window, minimum_group, enrolled_students, active_students, questions, no_material_rate, no_cited_source_rate, documents, suppressed]
      properties:
        window: { $ref: '#/components/schemas/ActivityWindow' }
        minimum_group: { type: integer, description: Fewest distinct students behind a figure that is shown (5) }
        enrolled_students: { type: integer }
        active_students: { type: integer, nullable: true, description: Distinct students who asked in the window; null below the minimum group }
        questions:
          type: array
          items: { $ref: '#/components/schemas/ActivityPeriod' }
        no_material_rate: { type: number, nullable: true, description: Share of answers that stored no source; null below the minimum group }
        no_cited_source_rate: { type: number, nullable: true, description: "Share of answers that cite none of their sources, including the answers with no material; null below the minimum group" }
        documents:
          type: array
          items: { $ref: '#/components/schemas/ActivityDocument' }
        suppressed: { type: boolean, description: True when at least one figure is null }
    Conversation:
      type: object
      properties:
        id: { type: string, format: uuid }
        subject_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        last_message_preview: { type: string, nullable: true }
    Message:
      type: object
      properties:
        id: { type: string, format: uuid }
        role: { type: string, enum: [user, assistant] }
        content: { type: string }
        created_at: { type: string, format: date-time }
        sources:
          type: array
          items: { $ref: '#/components/schemas/Source' }
        attribution:
          type: string
          nullable: true
          enum: [cited, retrieved, null]
          description: |
            Whether the sources were cited by the answer (`cited`: they are the chunks whose valid marker the answer contains) or are only the retrieved chunks because the answer holds no valid marker (`retrieved`). Null when there are no sources. It says nothing about whether a source supports a statement. Optional: clients that do not know it still receive the same `sources`.

security:
  - bearerAuth: []
