openapi: 3.0.3
info:
  title: AsistenteIA API
  version: 0.1.0
  description: |
    Canonical REST contract of AsistenteIA (RAG academic assistant by subject).
    The `readme.md` documents only the three core endpoints as an academic summary; this file is authoritative.

    Conventions:
    - All endpoints except `/health`, `/auth/register` and `/auth/login` require a Bearer JWT.
    - Errors use the common `Error` schema. Authorization failures never reveal whether a resource exists
      for another user: accessing someone else's resource returns 404 unless the caller is known to be
      authenticated and the resource type is not user-scoped (see each endpoint).
    - Chat requires recorded consent (`POST /users/me/consent`), otherwise 403 `CONSENT_REQUIRED`.
servers:
  - url: http://localhost:8000/api/v1
    description: Local development (docker compose)
tags:
  - name: Auth
  - name: Subjects
  - name: Enrollments
  - name: Documents
  - name: Chat
  - name: Conversations
  - name: Health

paths:
  /health:
    get:
      tags: [Health]
      summary: Liveness and database connectivity check
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
        '503':
          description: Database is unreachable (code `SERVICE_UNAVAILABLE`; no connection details are exposed)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new student account
      description: Public registration always creates role `student`. Teacher accounts are created out of band (seed/CLI command, see development guide) to prevent privilege escalation.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429':
          description: Too many registrations from this client address (code `RATE_LIMITED`). Configurable (`REGISTER_RATE_LIMIT`, default 5/minute); counters are in memory per process.
          headers:
            Retry-After:
              description: Seconds until another attempt is allowed
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: Database unreachable (code `SERVICE_UNAVAILABLE`; no connection details)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/login:
    post:
      tags: [Auth]
      summary: Obtain an access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, maxLength: 255, description: ASCII only; compared in lowercase }
                password: { type: string, format: password, minLength: 1, maxLength: 128 }
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401':
          description: Unknown email or wrong password (identical response for both; code `INVALID_CREDENTIALS`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429':
          description: Too many login attempts from this client address (code `RATE_LIMITED`). Limit is configurable (`LOGIN_RATE_LIMIT`, default 10/minute); counters are in memory per process.
          headers:
            Retry-After:
              description: Seconds until another attempt is allowed
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: Database unreachable (code `SERVICE_UNAVAILABLE`; no connection details)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /users/me:
    get:
      tags: [Auth]
      summary: Current user profile
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [Auth]
      summary: Delete the account and all associated personal data (right to erasure)
      responses:
        '204': { description: Account and data deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: A teacher must delete or reassign their subjects first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /users/me/consent:
    post:
      tags: [Auth]
      summary: Record acceptance of the privacy policy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [consent_version]
              properties:
                consent_version: { type: string, minLength: 1, maxLength: 20, example: "2026-10-v1" }
      responses:
        '200':
          description: Consent recorded (version and date updated, also on re-acceptance)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422':
          description: |
            Validation failed. A version that is not the currently configured policy version returns code
            `INVALID_CONSENT_VERSION` with `details.current_version`; an empty or over-long value returns `VALIDATION_ERROR`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /users/me/conversations:
    delete:
      tags: [Conversations]
      summary: Delete all of the current student's conversations (right to erasure)
      description: Role student. Permanent and irreversible.
      responses:
        '204': { description: All conversations deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /subjects:
    get:
      tags: [Subjects]
      summary: List subjects visible to the caller (teacher - taught subjects; student - enrolled subjects)
      responses:
        '200':
          description: Subjects
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Subject' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Subjects]
      summary: Create a subject (role teacher)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubjectCreate' }
      responses:
        '201':
          description: Subject created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subject' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /subjects/{subject_id}:
    parameters:
      - $ref: '#/components/parameters/SubjectId'
    get:
      tags: [Subjects]
      summary: Get a subject (owner teacher or enrolled student; any other caller gets 404)
      responses:
        '200':
          description: Subject
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subject' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Subjects]
      summary: Delete a subject with its documents, chunks, enrollments and conversations (role teacher, owner; another teacher gets 404)
      responses:
        '204': { description: Subject deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /subjects/{subject_id}/enrollments:
    parameters:
      - $ref: '#/components/parameters/SubjectId'
    get:
      tags: [Enrollments]
      summary: List enrolled students, ordered by creation time (role teacher, owner)
      responses:
        '200':
          description: Enrollments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Enrollment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Enrollments]
      summary: Enroll a registered student by email (role teacher, owner)
      description: |
        An email that belongs to no account, or to a teacher, answers the same 404 (no pre-enrollment).
        Enrolling a student twice answers 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [student_email]
              properties:
                student_email: { type: string, format: email, maxLength: 255, description: ASCII only (non-ASCII is rejected with 422); stored and matched in lowercase }
      responses:
        '201':
          description: Student enrolled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Enrollment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /subjects/{subject_id}/enrollments/{student_id}:
    delete:
      tags: [Enrollments]
      summary: Remove a student from a subject (role teacher, owner)
      parameters:
        - $ref: '#/components/parameters/SubjectId'
        - name: student_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Enrollment removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /subjects/{subject_id}/documents:
    parameters:
      - $ref: '#/components/parameters/SubjectId'
    get:
      tags: [Documents]
      summary: List documents of a subject with processing status (owner teacher)
      responses:
        '200':
          description: Documents
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Document' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Documents]
      summary: Upload course material (owner teacher)
      description: |
        Accepts PDF, plain text or Markdown up to `MAX_UPLOAD_MB`. Processing (extraction, chunking, embeddings)
        runs in a background task; the document is returned with `status` pending/processing and the client polls
        `GET /subjects/{subject_id}/documents`. Unsupported type -> 415; too large -> 413; PDF without extractable
        text -> document ends in `failed` with a clear `error_message`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '202':
          description: Upload accepted, processing started
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { description: File too large, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '415': { description: Unsupported file type, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /subjects/{subject_id}/documents/{document_id}:
    delete:
      tags: [Documents]
      summary: Delete a document and its chunks (owner teacher)
      parameters:
        - $ref: '#/components/parameters/SubjectId'
        - name: document_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Document deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /chat:
    post:
      tags: [Chat]
      summary: Ask the assistant a question about a subject (role student, enrolled, consent recorded)
      description: |
        Retrieval is restricted to chunks of `subject_id`. If `conversation_id` is given it must belong to the
        caller AND to the same `subject_id`. When no chunk reaches the relevance threshold the response has
        `no_material=true`, empty `sources`, and the LLM is not called.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject_id, message]
              properties:
                subject_id: { type: string, format: uuid }
                conversation_id: { type: string, format: uuid, nullable: true }
                message: { type: string, minLength: 1, maxLength: 2000 }
            example:
              subject_id: b2c3d4e5-1111-2222-3333-abcdef123456
              message: "What is the difference between RAG and fine-tuning?"
      responses:
        '200':
          description: Assistant answer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { description: Rate limit exceeded, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '502': { description: LLM provider failed or blocked the answer (retryable), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { description: Vector search unavailable, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /conversations:
    get:
      tags: [Conversations]
      summary: List the caller's conversations, optionally filtered by subject (role student)
      parameters:
        - name: subject_id
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Conversations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Conversation' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /conversations/{conversation_id}/messages:
    get:
      tags: [Conversations]
      summary: Messages of one of the caller's conversations, with sources
      parameters:
        - $ref: '#/components/parameters/ConversationId'
      responses:
        '200':
          description: Messages ordered by creation time
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Message' }
        '404': { $ref: '#/components/responses/NotFound' }

  /conversations/{conversation_id}:
    delete:
      tags: [Conversations]
      summary: Permanently delete one of the caller's conversations and its messages
      parameters:
        - $ref: '#/components/parameters/ConversationId'
      responses:
        '204': { description: Conversation deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    SubjectId:
      name: subject_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ConversationId:
      name: conversation_id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Unauthorized:
      description: Missing or invalid token
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: Authenticated but not allowed (wrong role; for chat also not enrolled or consent missing)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Resource does not exist or is not visible to the caller (including another user's resources); the body is identical in both cases
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Conflict:
      description: Resource already exists or state conflict
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    ValidationError:
      description: Request validation failed
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            Stable machine-readable code. Generic codes: UNAUTHORIZED, FORBIDDEN, NOT_FOUND, METHOD_NOT_ALLOWED,
            CONFLICT, VALIDATION_ERROR, INTERNAL_ERROR, SERVICE_UNAVAILABLE. Authentication adds INVALID_CREDENTIALS,
            RATE_LIMITED and INVALID_CONSENT_VERSION. Feature changes add their own (e.g. CONSENT_REQUIRED, LLM_UNAVAILABLE).
          example: CONSENT_REQUIRED
        message: { type: string }
        details: { type: object, additionalProperties: true, nullable: true }
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        email: { type: string, format: email, maxLength: 255, description: ASCII only (non-ASCII is rejected with 422; use punycode for internationalised domains); stored in lowercase }
        password: { type: string, format: password, minLength: 10, maxLength: 128 }
    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token: { type: string }
        token_type: { type: string, example: bearer }
        expires_in: { type: integer, description: Seconds }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [teacher, student] }
        consent_version: { type: string, nullable: true }
        consent_accepted_at: { type: string, format: date-time, nullable: true }
    SubjectCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 150, description: Trimmed single-line text without control or direction characters; unique per teacher (case-sensitive) }
        description: { type: string, nullable: true, maxLength: 2000, description: Plain text, trimmed; a blank value is stored as null; line breaks and tabs allowed, other control characters rejected }
    Subject:
      allOf:
        - $ref: '#/components/schemas/SubjectCreate'
        - type: object
          required: [id, teacher_id, created_at]
          properties:
            id: { type: string, format: uuid }
            teacher_id: { type: string, format: uuid }
            created_at: { type: string, format: date-time }
    Enrollment:
      type: object
      required: [id, subject_id, student_id, student_email, created_at]
      properties:
        id: { type: string, format: uuid }
        subject_id: { type: string, format: uuid }
        student_id: { type: string, format: uuid }
        student_email: { type: string, format: email }
        created_at: { type: string, format: date-time }
    Document:
      type: object
      properties:
        id: { type: string, format: uuid }
        subject_id: { type: string, format: uuid }
        filename: { type: string }
        content_type: { type: string }
        size_bytes: { type: integer }
        status: { type: string, enum: [pending, processing, ready, failed] }
        error_message: { type: string, nullable: true }
        chunks_count: { type: integer }
        created_at: { type: string, format: date-time }
    Source:
      type: object
      description: Citation of a chunk used for an answer
      properties:
        chunk_id: { type: string, format: uuid, nullable: true }
        document_id: { type: string, format: uuid, nullable: true }
        filename: { type: string }
        page_number: { type: integer, nullable: true }
        rank: { type: integer }
        snippet: { type: string, description: Short excerpt of the chunk, maxLength 300 }
    ChatResponse:
      type: object
      required: [conversation_id, message_id, answer, sources, no_material]
      properties:
        conversation_id: { type: string, format: uuid }
        message_id: { type: string, format: uuid }
        answer: { type: string }
        no_material: { type: boolean }
        sources:
          type: array
          items: { $ref: '#/components/schemas/Source' }
      example:
        conversation_id: 9a8b7c6d-4444-5555-6666-abcdef123456
        message_id: 1f2e3d4c-7777-8888-9999-abcdef123456
        answer: "According to unit 1, RAG retrieves context at query time without changing model weights..."
        no_material: false
        sources:
          - { chunk_id: 3f1a9c2e-1234-4a5b-8c9d-abcdef123456, document_id: 7c6b5a49-0000-1111-2222-abcdef123456, filename: unit1-introduction.pdf, page_number: 4, rank: 1, snippet: "RAG combines retrieval with generation..." }
    Conversation:
      type: object
      properties:
        id: { type: string, format: uuid }
        subject_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        last_message_preview: { type: string, nullable: true }
    Message:
      type: object
      properties:
        id: { type: string, format: uuid }
        role: { type: string, enum: [user, assistant] }
        content: { type: string }
        created_at: { type: string, format: date-time }
        sources:
          type: array
          items: { $ref: '#/components/schemas/Source' }

security:
  - bearerAuth: []
