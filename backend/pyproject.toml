[project]
name = "asistenteia-backend"
version = "0.1.0"
description = "AsistenteIA backend (FastAPI, layered architecture)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pyjwt>=2.15.1",
    "argon2-cffi>=25.1.0",
    "pydantic[email]>=2.14.1",
    "limits>=5.8.0",
    "python-dotenv>=1.2.4",
    "pgvector>=0.5.1,<0.6",
    "python-multipart==0.0.33",
]

# Ingestion dependencies are optional so the API image and CI stay light (see the Dockerfile
# targets). `ingestion` is needed to parse and chunk; `embedding` only by the worker image.
[project.optional-dependencies]
ingestion = [
    "pypdf==7.0.0",
    "langchain-text-splitters==1.1.3",
]
embedding = [
    "sentence-transformers==6.2.0",
    "torch==2.15.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "httpx2>=2.16",
    "ruff>=0.6",
    "mypy>=1.11",
    "pip-audit>=2.7",
]

# CPU-only torch on Linux (the worker container). Without this the default wheel pulls CUDA
# packages: the worker image went from 2.8 GB to 9.4 GB in the spike. Windows and macOS keep PyPI.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
# The administration commands build DDL/DCL (CREATE ROLE, GRANT, ALTER ... OWNER) that cannot take
# bind parameters; every identifier is validated by `app/db_admin/sql.py` before it is composed.
"app/db_admin/*.py" = ["S608"]
"tests/db_admin_support.py" = ["S608"]
"tests/role_support.py" = ["S608"]
"tests/db_roles_support.py" = ["S608"]
"tests/integration/test_db_roles_*.py" = ["S608"]
"tests/integration/test_db_admin_*.py" = ["S608"]

[tool.mypy]
strict = true
python_version = "3.12"
# The worker and CI run on Linux; the PDF child uses POSIX-only calls (rlimit, killpg, signals).
platform = "linux"
plugins = ["pydantic.mypy"]
files = ["app", "tests"]

[[tool.mypy.overrides]]
module = ["sentence_transformers.*", "torch.*", "transformers.*", "yaml"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# `realmodel` tests need the baked-in embedding model (worker image) and are excluded by default;
# run them with `pytest -m realmodel` (a later -m overrides this one).
addopts = "-ra -m 'not realmodel'"
markers = [
    "integration: needs a real PostgreSQL test database (TEST_DATABASE_URL)",
    "realmodel: needs the real embedding model (worker image); excluded from CI and default runs",
]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

# The `if __name__ == "__main__"` guards of `app.worker` and `app.rag.pdf_child` run only in the
# processes the real-process tests start (coverage does not follow child processes).
[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:"]
